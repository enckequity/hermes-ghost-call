[build-system]
requires = ["setuptools>=68,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-ghost-call"
version = "0.1.0"
description = "Ghost Call Copilot: Hermes listens to your phone call and whispers short hints to you only (Hermes Agent plugin)."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "winchxyz"}]
# Runtime only. Test tools live in requirements-dev.txt, never in an install extra.
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.29,<1",
  "websockets>=14,<16",
  "httpx>=0.27,<1",
]

[project.urls]
Homepage = "https://github.com/winchxyz/hermes-ghost-call"

[tool.setuptools]
packages = ["hermes_ghost_call", "hermes_ghost_call.bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = ["e2e: needs real API keys and a live bridge"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"hermes_ghost_call/bridge/webpage.py" = ["E501"]  # embedded HTML/JS/CSS
